[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phishing-risk-platform"
version = "0.1.0"
description = "AI Phishing Risk & Security Triage Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"

# Core runtime dependencies
# Each group is added phase-by-phase as components are built.
# Phase 1: configuration only
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Install with: pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",  # async test support for httpx AsyncClient
]

# Phase 2: data handling and feature engineering
# Install with: pip install -e ".[dev,data]"
data = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",  # Direct use for classical model persistence (Phase 3)
]

# Phase 4 Step 2: optional Kaggle training dependencies; local tests need not install these.
# Install on Kaggle with: pip install -e ".[dev,data,nlp]"
nlp = [
    "torch>=2.6,<3",
    "transformers>=4.46,<5",
    "datasets>=3,<5",
    "accelerate>=1,<2",
    "huggingface-hub>=0.26,<1",
    "safetensors>=0.4",
]

# Phase 6: FastAPI serving layer + API testing
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx2>=0.28",    # Required by Starlette 1.7+ TestClient (replaces httpx)
    "structlog>=24.0",
]

# Phase 7 additions (uncomment when starting Phase 7):
# rag = [
#     "chromadb>=0.5",
#     "sentence-transformers>=3.0",
# ]

# Phase 8 additions (uncomment when starting Phase 8):
# agent = [
#     "langgraph>=0.1",
#     "langchain-core>=0.2",
#     "langchain-google-genai>=1.0",
#     "langchain-groq>=0.1",
# ]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail loudly on any unraisable exception — good default for a learning project
addopts = "-v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
