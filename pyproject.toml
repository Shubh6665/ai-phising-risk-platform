[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phishing-risk-platform"
version = "0.1.0"
description = "AI Phishing Risk & Security Triage Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"

# Core runtime dependencies
# Each group is added phase-by-phase as components are built.
# Phase 1: configuration only
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Install with: pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# Phase 2: data handling and feature engineering
# Install with: pip install -e ".[dev,data]"
data = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

# Phase 4 additions (uncomment when starting Phase 4):
# nlp = [
#     "torch>=2.2",
#     "transformers>=4.40",
#     "datasets>=2.19",
#     "huggingface_hub>=0.22",
#     "sentencepiece>=0.2",
# ]

# Phase 6 additions (uncomment when starting Phase 6):
# api = [
#     "fastapi>=0.111",
#     "uvicorn[standard]>=0.29",
#     "sqlalchemy>=2.0",
#     "asyncpg>=0.29",
#     "httpx>=0.27",    # for TestClient
#     "structlog>=24.0",
# ]

# Phase 7 additions (uncomment when starting Phase 7):
# rag = [
#     "chromadb>=0.5",
#     "sentence-transformers>=3.0",
# ]

# Phase 8 additions (uncomment when starting Phase 8):
# agent = [
#     "langgraph>=0.1",
#     "langchain-core>=0.2",
#     "langchain-google-genai>=1.0",
#     "langchain-groq>=0.1",
# ]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail loudly on any unraisable exception — good default for a learning project
addopts = "-v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
